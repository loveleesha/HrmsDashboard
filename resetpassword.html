<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Hike Associate</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Heebo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom Auth CSS -->
    <link rel="stylesheet" href="style/auth.css">
</head>

<body>

    <div class="auth-shell">

        <main class="auth-card">

            <!-- Brand -->
            <div class="brand-mark">
                H
            </div>

            <!-- Eyebrow -->
            <div class="eyebrow">
                Create New Password
            </div>

            <!-- Heading -->
            <h1>
                Reset your password
            </h1>

            <!-- Description -->
            <p class="subtitle">
                Create a new password for your Hike Associate account.
                Make sure it's strong and easy for you to remember.
            </p>

            <form>

                <!-- New Password -->
                <div class="mb-3">

                    <label for="newPassword" class="form-label">
                        New password
                    </label>

                    <div class="input-group">

                        <input type="password" id="newPassword" class="form-control"
                            placeholder="Enter your new password" autocomplete="new-password">

                        <button type="button" class="btn btn-light-custom"
                            onclick="togglePassword('newPassword', this)">
                            Show
                        </button>

                    </div>

                </div>

                <!-- Confirm Password -->
                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm password
                    </label>

                    <div class="input-group">

                        <input type="password" id="confirmPassword" class="form-control"
                            placeholder="Confirm your new password" autocomplete="new-password">

                        <button type="button" class="btn btn-light-custom"
                            onclick="togglePassword('confirmPassword', this)">
                            Show
                        </button>

                    </div>

                </div>

                <!-- Password Requirements -->
                <div class="password-rules mb-4">

                    <div>
                        • Minimum 8 characters
                    </div>

                    <div>
                        • Include uppercase and lowercase letters
                    </div>

                    <div>
                        • Include at least one number
                    </div>

                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary-custom w-100">
                    Update Password
                </button>

            </form>

            <div class="footer-note">
                Your password will be securely updated
            </div>

        </main>

    </div>


    <script>

        function togglePassword(id, button) {

            const input = document.getElementById(id);

            const isPassword = input.type === "password";

            input.type = isPassword ? "text" : "password";

            button.textContent = isPassword ? "Hide" : "Show";

        }

    </script>

</body>

</html>

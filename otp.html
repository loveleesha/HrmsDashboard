<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Hike Associate</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Heebo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Custom Auth CSS -->
    <link rel="stylesheet" href="style/auth.css">
</head>

<body>

<div class="auth-shell">

    <main class="auth-card">

        <!-- Brand -->
        <div class="brand-mark">
               H
        </div>

        <!-- Eyebrow -->
        <div class="eyebrow">
            Verification
        </div>

        <!-- Heading -->
        <h1>
            Verify your email
        </h1>

        <!-- Description -->
        <p class="subtitle">
            We've sent a 6-digit verification code to
            <strong>you@example.com</strong>.
        </p>

        <form>

            <!-- OTP -->
            <div class="otp-wrap">

                <input
                    type="text"
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    aria-label="OTP digit 1"
                >

                <input
                    type="text"
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric"
                    aria-label="OTP digit 2"
                >

                <input
                    type="text"
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric"
                    aria-label="OTP digit 3"
                >

                <input
                    type="text"
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric"
                    aria-label="OTP digit 4"
                >

                <input
                    type="text"
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric"
                    aria-label="OTP digit 5"
                >

                <input
                    type="text"
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric"
                    aria-label="OTP digit 6"
                >

            </div>

            <!-- Timer -->
            <div class="text-center mb-4 small text-secondary">
                Code expires in
                <strong>01:00</strong>
            </div>

            <!-- Verify -->
            <button
                type="submit"
                class="btn btn-primary-custom w-100"
            >
                Verify Code
            </button>

            <!-- Resend -->
            <div class="text-center mt-4">

                <span class="small text-secondary">
                    Didn't receive the code?
                </span>

                <a
                    href="#"
                    class="link-primary-custom small ms-1"
                >
                    Resend OTP
                </a>

            </div>

            <!-- Back -->
            <div class="text-center">

                <a
                    href="forgot-password.html"
                    class="back-link"
                >
                    ← Change email
                </a>

            </div>

        </form>

    </main>

</div>

<script>

const otpInputs = document.querySelectorAll(".otp-input");

otpInputs.forEach((input, index) => {

    input.addEventListener("input", function () {

        this.value = this.value.replace(/[^0-9]/g, "");

        if (this.value && otpInputs[index + 1]) {
            otpInputs[index + 1].focus();
        }

    });

    input.addEventListener("keydown", function (event) {

        if (
            event.key === "Backspace" &&
            !this.value &&
            otpInputs[index - 1]
        ) {
            otpInputs[index - 1].focus();
        }

    });

});

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | Hike Associate</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Heebo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Custom Auth CSS -->
  <link rel="stylesheet" href="style/auth.css">
</head>

<body>

<div class="auth-shell">

  <main class="auth-card">

    <!-- Brand -->
    <div class="brand-mark">
         H
    </div>

    <!-- Heading -->
    <div class="eyebrow">
      Account Recovery
    </div>

    <h1>
      Forgot your password?
    </h1>

    <p class="subtitle">
      No worries. Enter your registered email address and
      we'll send you a verification code.
    </p>

    <!-- Information -->
    <div class="security-note mb-4">
      Enter the email address associated with your
      Hike Associate account to continue.
    </div>

    <form>

      <!-- Email -->
      <div class="mb-4">

        <label class="form-label">
          Email address
        </label>

        <input
          type="email"
          class="form-control"
          placeholder="Enter your email address"
          autocomplete="email"
        >

      </div>

      <!-- Button -->
      <button
        type="submit"
        class="btn btn-primary-custom w-100"
      >
        Send Verification Code
      </button>

      <!-- Back -->
      <div class="text-center">

        <a
          href="login.html"
          class="back-link"
        >
          ← Back to login
        </a>

      </div>

    </form>

    <div class="footer-note">
      Secure account recovery
    </div>

  </main>

</div>

</body>
</html>
